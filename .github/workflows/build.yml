name: Build FitCoach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project
        run: |
          echo "Files in repo:"; ls -la
          Z=$(find . -maxdepth 3 -iname '*.zip' | head -n1)
          if [ -n "$Z" ]; then echo "Unzipping $Z"; unzip -q -o "$Z" -d _unpacked; fi
          S=$(find . -name setup.sh -not -path '*/node_modules/*' | head -n1)
          if [ -z "$S" ]; then
            echo "ERROR: project not found. Upload fitcoach-android.zip to the repository root."
            exit 1
          fi
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Create Android project
        run: |
          cd "$PROJ"
          bash setup.sh

      - name: Build APK
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/FitCoach.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FitCoach-APK
          path: out/FitCoach.apk
