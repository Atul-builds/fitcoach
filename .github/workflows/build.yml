name: Build FitCoach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack project
        run: unzip -q fitcoach-android.zip

      - name: Create Android project
        working-directory: fitcoach-android
        run: bash setup.sh

      - name: Build APK
        working-directory: fitcoach-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FitCoach-APK
          path: fitcoach-android/android/app/build/outputs/apk/debug/app-debug.apk
